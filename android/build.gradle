buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:4.1.3"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// Detect which npm package is installed by reading its own package.json.
// When published as react-native-shield-full-plugin the name field differs.
def packageJson = new groovy.json.JsonSlurper().parseText(
  new File("${project.projectDir}/../package.json").text
)
def isFullPlugin = packageJson.name == "react-native-shield-full-plugin"
def shieldSdkArtifact = isFullPlugin ? "com.shield.android:shield:2.6.1" : "com.shield.android:shield-fraud:2.6.1"

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ShieldFraudPlugin_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ShieldFraudPlugin_" + name]).toInteger()
}

android {
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  // Conditional for compatibility with AGP <4.2.
  if (project.android.hasProperty("namespace")) {
    namespace 'com.shieldfraudplugin'
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      // Select the architecture-specific ShieldFraudPluginSpec shim at build time.
      // - oldarch: extends ReactContextBaseJavaModule (Old Architecture / bridge)
      // - newarch: extends the codegen-generated NativeShieldFraudPluginSpec (New Architecture)
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ['src/newarch']
      } else {
        java.srcDirs += ['src/oldarch']
      }
    }
  }

  if (isNewArchitectureEnabled()) {
    react {
      jsRootDir = file("../src/")
      libraryName = "ShieldFraudPlugin"
      codegenJavaPackageName = "com.shieldfraudplugin"
    }
  }
}

rootProject.allprojects {
  repositories {
    mavenCentral()
    google()
    maven {
      url "https://cashshield-sdk.s3.amazonaws.com/release/"
      content {
        includeGroup "com.shield.android"
        includeGroup "com.shield.android.module"
      }
    }
  }
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  implementation "com.facebook.react:react-native:0.71.7"

  implementation shieldSdkArtifact
}
